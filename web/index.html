<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>CrossBorderOps · Agent 控制台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='14' fill='white' text-anchor='middle'%3ECB%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" aria-label="侧边栏">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">CB</div>
        <div class="brand-text">
          <div class="brand-title">CrossBorderOps</div>
          <div class="brand-sub">· Agent 控制台</div>
        </div>
      </div>

      <div id="health-badge" class="health-badge">
        <div class="health-row"><span class="dot pending"></span><strong>正在连接</strong></div>
        <div class="health-meta">/api/health</div>
      </div>

      <div class="side-block projects-block">
        <div class="side-head">
          <span>项目</span>
          <span class="side-count" id="project-count">—</span>
        </div>
        <div class="project-list" id="project-list">
          <div class="sk sk-project"></div>
          <div class="sk sk-project"></div>
        </div>
      </div>

      <button class="btn btn-primary btn-block sidebar-run" id="sidebar-run" data-action="run-full" type="button">
        <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4.8v10.4l8-5.2z"/></svg>
        重跑完整流水线
      </button>

      <nav class="nav" aria-label="主导航">
        <button class="nav-item active" data-view="workbench" type="button">
          <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="5.5" height="5.5" rx="1.2"/><rect x="11.5" y="3" width="5.5" height="5.5" rx="1.2"/><rect x="3" y="11.5" width="5.5" height="5.5" rx="1.2"/><rect x="11.5" y="11.5" width="5.5" height="5.5" rx="1.2"/></svg>
          <span>工作台</span>
          <span class="nav-hint">RUN</span>
        </button>
        <button class="nav-item" data-view="eval" type="button">
          <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2.8 16 5v4.3c0 3.5-2.4 6.2-6 7.9-3.6-1.7-6-4.4-6-7.9V5z"/><path d="m7.3 9.8 1.9 1.9 3.7-3.9"/></svg>
          <span>评测门禁</span>
          <span class="nav-hint">EVAL</span>
        </button>
        <button class="nav-item" data-view="metrics" type="button">
          <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 16.5h14"/><path d="M5 13V9"/><path d="M9 13V5.5"/><path d="M13 13V8"/><path d="M17 13V3.5"/></svg>
          <span>指标</span>
          <span class="nav-hint">MTR</span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <div class="foot-title">流水线图例</div>
        <div class="legend">
          <span><i class="dot pending"></i>待运行</span>
          <span><i class="dot running"></i>执行中</span>
          <span><i class="dot succeeded"></i>已通过</span>
          <span><i class="dot failed"></i>失败</span>
        </div>
        <div class="foot-note">7 Agent · 契约校验 · 人工审批</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar" id="topbar">
        <div class="tb-skeleton">
          <div class="sk" style="width:260px;height:20px"></div>
          <div class="sk" style="width:180px;height:11px;margin-top:9px"></div>
        </div>
      </header>

      <div class="scroll" id="scroll">
        <section class="view" id="view-workbench">
          <div id="action-bar"></div>
          <div id="approval-slot"></div>
          <div id="pipeline"></div>
          <div id="tabs"></div>
          <div class="wb-grid">
            <div class="tab-panel card" id="tab-panel">
              <div class="loading-state"><span class="spinner"></span><div>正在加载控制台…</div></div>
            </div>
            <aside class="rail" id="rail">
              <div class="rail-card">
                <div class="sk" style="width:100px;height:12px"></div>
                <div class="sk" style="width:100%;height:58px;margin-top:12px"></div>
                <div class="sk" style="width:100%;height:90px;margin-top:10px"></div>
              </div>
            </aside>
          </div>
        </section>

        <section class="view hidden" id="view-eval"></section>
        <section class="view hidden" id="view-metrics"></section>
      </div>
    </main>
  </div>

  <div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="false"></div>
  <div id="modal-root"></div>
  <noscript><div class="noscript">此控制台需要启用 JavaScript。</div></noscript>

  <script src="./app.js" defer></script>
</body>
</html>
