name: crossborderops

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: crossborderops-agent-platform:0.7.0
    container_name: crossborderops-api
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      DATABASE_URL: sqlite:////app/data/studio.db
      DATA_DIR: /app/data
      LLM_PROVIDER: mock
      HUMAN_APPROVAL: "true"
    volumes:
      - app-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  app-data:
